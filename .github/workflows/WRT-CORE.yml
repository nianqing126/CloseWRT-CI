#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    # runner 保持 ubuntu-latest，环境准备改用【显式 apt 包列表】，
    # 不再调用 immortalwrt 官方 init_build_environment.sh。
    #
    # 原因：GitHub 于 2026-10 把 ubuntu-latest 提升到 ubuntu-26.04，
    # 而官方脚本的 OS 白名单只含 focal/jammy/noble，直接拒绝：
    #   [INFO] Checking system info...
    #   [ERROR] Unsupported OS, use Ubuntu 20.04 instead.
    # → 所有 matrix job 在 Initialization Environment 阶段失败（run 40243216267）。
    #
    # 采用上游 VIKINGYFY 在 main 的 ffc0a6d「项目调整」中的显式列表方案，
    # 并补回该列表相对官方脚本缺失的包（否则会在后期才失败）：
    #   squashfs-tools   -> 无 mksquashfs 则生成不了 squashfs 固件
    #   autoconf/automake/libtool/autopoint/binutils/fakeroot -> 大量包 configure/打包依赖
    #   haveged          -> 熵源，避免 Go/Rust 编译因熵不足卡住
    #   libglib2.0-dev/libz-dev/libreadline-dev/libgmp3-dev/libmpc-dev/libmpfr-dev
    #   libyaml-dev/libgc-dev 类头文件 -> 常见构建依赖
    #   python3-pip/python3-ply/python3-requests/python3-docutils/libpython3-dev
    #   p7zip/p7zip-full/lrzsz/sharutils/subversion/quilt/re2c/xxd -> 打包与补丁工具
    # 【runner 固定 Ubuntu 24.04，不要用 ubuntu-latest】
    # 对齐 V-OWRT-CI 4a63a0c 的实测结论：同一份 workflow、同一个 Update Feeds
    # 步骤，ubuntu-24.04 上 1.1 分钟，ubuntu-26.04 上 29.2 分钟（26 倍），
    # 会撞步骤超时把整条流水线拖死。GitHub 已于 2026-10 把 ubuntu-latest
    # 提升到 26.04，继续用 latest 等于默认踩这个坑。
    # 24.04 是目前唯一有完整成功记录的基线（25 步全过、70 分钟一次通过）。
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      # ═══════════════════════════════════════════════════════════════════
      # 环境初始化拆成 4 步（对齐 V-OWRT-CI e959620/43ff627/9df07ba/4a63a0c）。
      # 原来的一体化步骤有三个真实问题：
      #   1) full-upgrade 在容器化 runner 上会尝试升级 systemd 等核心包，
      #      无法重启服务 → 命令永久挂起；
      #   2) purge firefox 会触发 snapd 操作，在 runner 里极易卡死；
      #   3) apt-get install 一个包名对不上就整体 exit 2，而包名随发行版漂移
      #      （24.04 起 p7zip 由 7zip 承接、libz-dev 在 Ubuntu 侧不存在），
      #      硬列表一旦遇到漂移就把流水线拖垮，报错只有一句 exit code 2。
      # 拆分后每步独立超时、独立告警，且依赖安装先探测再装。
      # ═══════════════════════════════════════════════════════════════════
      - name: Initialization Environment · 释放磁盘
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Ubuntu runner 镜像预装 android(~10G)/ghc(~5G)/dotnet(~2.5G)/
          # CodeQL(~5G)/boost(~1G) 合计约 23GB，构建完全用不到。不清理时可用
          # 空间仅约 30GB，而 MTK-CPE 这类目标需 20-25GB（dl 3.8GB 其中单个
          # go-mod-cache 就 1.9GB；build_dir+staging 15-20GB），会在
          # Download Packages / Compile Firmware 阶段把磁盘写满。
          df -h /
          timeout 300 sudo rm -rf /usr/local/lib/android \
            /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/lib/node_modules \
            /opt/google/chrome || echo "::warning::清理预装组件超时或被跳过"
          echo "=== 清理后 ==="; df -h /

      - name: Initialization Environment · apt 索引
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 不执行 full-upgrade：它会尝试升级 systemd 等核心包，容器化 runner
          # 无法重启这些服务，命令永久挂起。
          # 不执行 autoremove --purge：无 upgrade 的环境里同样可能长时间锁包。
          # 不执行 purge firefox：Ubuntu 的 firefox 是 snap 包，purge 会触发
          # snapd 操作，在 runner 容器里极易卡死，且清理它对构建毫无收益。
          timeout 420 sudo apt-get -yqq update \
            || echo "::warning::apt update 超时或失败，继续尝试安装依赖"
          timeout 120 sudo apt-get -yqq clean || true
          timeout 120 sudo apt-get -yqq autoclean || true

      - name: Initialization Environment · 安装依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 上游 ffc0a6d 用本列表替代了 immortalwrt 官方 init_build_environment.sh，
          # 但该列表不完整（低于官方脚本），缺失会导致编译在后期才失败。
          # 以下包为对比官方脚本后补回：
          #   squashfs-tools  -> 无 mksquashfs 则无法生成 squashfs 固件
          #   libfuse-dev     -> squashfs 相关构建需要
          #   haveged         -> 提供熵源，避免 Go/Rust 编译因熵不足卡住
          #   autoconf/automake/binutils/fakeroot/libtool 等 -> 大量包 configure 依赖
          #   libz-dev/libglib2.0-dev/libreadline-dev 等 -> 常见构建期头文件
          #   p7zip/p7zip-full/lrzsz/sharutils/subversion/xxd -> 打包与脚本工具
          #
          # ── 逐包探测再安装，不要直接硬装 ──
          # apt-get install 只要有一个包名对不上就整体失败（exit 2），而包名在
          # 发行版之间会漂移：Ubuntu 24.04 起 p7zip 由 7zip 承接、libz-dev 在
          # Ubuntu 侧不存在（只有 zlib1g-dev）。先探测每个包有没有实际候选版本，
          # 缺失的跳过并告警，只把能装的交给 apt。
          PKGS="bc bison build-essential bzip2 ca-certificates ccache clang cmake cpio curl device-tree-compiler dos2unix file flex g++-multilib gawk gcc-multilib genisoimage gettext git jq libbpf-dev libclang-dev libdw-dev libelf-dev libncurses-dev libssl-dev lld llvm ninja-build patch perl pkgconf python3 python3-cryptography python3-dev python3-packaging python3-pyelftools python3-setuptools qemu-utils rsync swig unzip wget xz-utils zlib1g-dev zstd squashfs-tools libfuse-dev haveged autoconf automake autopoint binutils fakeroot libtool libltdl-dev re2c quilt pkg-config libglib2.0-dev libz-dev libreadline-dev libgmp3-dev libmpc-dev libmpfr-dev libyaml-dev libc6-dev-i386 p7zip p7zip-full lrzsz sharutils subversion m4 xxd python3-pip python3-ply python3-requests python3-docutils libpython3-dev nano vim texinfo xmlto help2man intltool gperf"
          MISSING=""
          AVAIL=""
          for p in $PKGS; do
            if apt-cache policy "$p" 2>/dev/null | grep -q 'Candidate: [0-9]'; then
              AVAIL="$AVAIL $p"
            else
              MISSING="$MISSING $p"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::warning title=依赖包跳过::当前发行版无可用版本:$MISSING"
          fi

          # ── 只装尚未安装的包 ──
          # Ubuntu runner 镜像已预装 llvm/clang/lld/build-essential 等一大批工具。
          # 对已安装的包再次 apt-get install 会触发 aptitude 检查与可能的升级下载，
          # 在慢速 runner 上实测能把这一步从 1 分钟拖到 25 分钟以上。
          TO_INSTALL=""
          ALREADY=0
          for p in $AVAIL; do
            if dpkg -s "$p" >/dev/null 2>&1; then
              ALREADY=$((ALREADY+1))
            else
              TO_INSTALL="$TO_INSTALL $p"
            fi
          done
          N=$(echo $TO_INSTALL | wc -w)
          echo "包状态：已安装 $ALREADY 个，需要新装 $N 个"
          echo "待装清单：$TO_INSTALL"
          df -h /

          # ── 不要在 apt 超时或非零退出时直接 exit 1 ──
          # 实测同一份包列表在不同 runner 上耗时从 1-2 分钟到 27 分钟以上不等
          # （llvm/clang/lld 合计 1-2GB，慢速 runner 上下载不完）。timeout 杀掉
          # apt 时大部分包其实已经装好，直接判失败会让整条流水线白跑。
          # 正确做法：超时/异常后修复 dpkg 状态，再由下面的关键工具校验决定成败。
          apt_opts="-y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Pipeline-Depth=10"
          if [ "$N" -eq 0 ]; then
            echo "所有依赖包均已预装，跳过 apt install"
          elif ! timeout 2400 sudo apt-get install $apt_opts $TO_INSTALL; then
            rc=$?
            echo "::warning title=apt install 未正常结束::rc=$rc（124=2400s 超时），尝试修复 dpkg 状态后继续"
            sudo dpkg --configure -a 2>/dev/null || true
            sudo apt-get -yqq -f install 2>/dev/null || true
            df -h /
          fi

          # 关键工具必须到位，否则要等到编译后期才暴露（那时已经烧掉半小时）。
          # 这一步才是安装阶段真正的成败判据。
          MISSING_CRIT=""
          for c in mksquashfs gcc g++ make cmake ninja python3 rsync ccache \
                   bison flex patch perl unzip wget xz; do
            command -v "$c" >/dev/null 2>&1 || MISSING_CRIT="$MISSING_CRIT $c"
          done
          if [ -n "$MISSING_CRIT" ]; then
            echo "::error title=关键工具缺失::构建必需但未安装:$MISSING_CRIT"
            df -h /
            exit 1
          fi
          echo "关键工具校验通过"

      - name: Initialization Environment · 时区与目录
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai" \
            || echo "::warning::设置时区失败（不影响构建）"
          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -sfn /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # 如果不存在 defconfig 则直接结束工作流
          if [ ! -d "defconfig" ]; then
            echo "defconfig directory not found, stopping workflow."
            exit 0
          fi

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Check Caches
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache@main
        with:
          key: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skiped done!"
          else
            echo "caches missed!"
          fi

          if ${{steps.check-cache.outputs.cache-hit != 'true'}}; then
            CACHE_LIST=$(gh cache list --key "$WRT_CONFIG-$WRT_INFO" | cut -f 1)
            for CACHE_KEY in $CACHE_LIST; do
              gh cache delete $CACHE_KEY
            done

            echo "caches cleanup done!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          # QModem 是 OpenWrt Feed（多包结构：application/ driver/ luci/），
          # 必须经 feeds 机制安装 —— 直接 git clone 到 package/ 会使
          # package/QModem/ 下的子包全部无法被扫描。
          # 仅对 CPE 目标注入，避免影响其他固件目标。
          # 参考: https://github.com/FUjr/QModem/blob/main/docs/user/installation.zh-cn.md
          if [[ "${WRT_CONFIG^^}" == *"CPE"* ]]; then
            if ! grep -q 'FUjr/QModem' feeds.conf.default 2>/dev/null; then
              echo "src-git qmodem https://github.com/FUjr/QModem.git;main" >> feeds.conf.default
              echo "QModem feed has been added to feeds.conf.default!"
            fi
          fi

          # 给 feeds 操作加超时与时间戳。feeds.conf.default 里有 7 个 feed 仓库，
          # 合计约 600MB。GitHub runner 与 GitHub 同机房，正常 2-5 分钟；但单个
          # 仓库响应慢时会无限等待 —— 实测该步骤曾卡 23 分钟以上且没有任何超时
          # 保护，整条流水线就此挂住（对齐 V-OWRT-CI 1074aa5）。
          echo "=== feeds update -a 开始 $(date +%T) ==="
          timeout 1800 ./scripts/feeds update -a || {
            rc=$?
            echo "::warning title=feeds update -a::退出码 $rc（124=1800s 超时），继续后续步骤"
          }
          echo "=== feeds update -a 结束 $(date +%T) ==="

          # 修正上游 QModem feed 的【目录名 != PKG_NAME】问题。
          # feeds/package 扫描用【目录名】注册包，但 Makefile 的 DEPENDS /
          # LUCI_DEPENDS 用【PKG_NAME】引用，两者不一致时依赖永远无法解析，
          # 整个包 symbol 被 kconfig 隐藏。
          #
          # 实测（git clone FUjr/QModem@main 后逐目录比对）共 10 处不一致。
          # 其中以下 4 处位于【无条件依赖链】上，不改则 qmodem 主包或
          # luci-app-qmodem-next 必然进不了 .config：
          #   application/qmodem_settings    → qmodem-settings    (主包无守卫依赖)
          #   application/ubus_at_daemon     → ubus-at-daemon     (主包无守卫依赖)
          #   application/qmodem_smsd        → qmodem-smsd        (next 依赖)
          #   application/sms_forwarder_next → sms-forwarder-next (next 依赖)
          #   application/quectel_CM_5G_M    → quectel-CM-5G-M    (主包条件依赖)
          # 其余 5 处（含 driver/ 下 4 处）虽挂在未选中 choice 下，
          # 一并修正以消除隐患，成本为零。
          if [[ "${WRT_CONFIG^^}" == *"CPE"* ]] && [ -d feeds/qmodem/application ]; then
            for pair in \
              "qmodem_settings:qmodem-settings" \
              "quectel_CM_5G_M:quectel-CM-5G-M" \
              "ubus_at_daemon:ubus-at-daemon" \
              "qmodem_smsd:qmodem-smsd" \
              "qmodem_sipd:qmodem-sipd" \
              "sms_forwarder:sms-forwarder" \
              "sms_forwarder_next:sms-forwarder-next" \
              "voipd:qmodem-voip"; do
              old="${pair%%:*}"; new="${pair##*:}"
              if [ -d "feeds/qmodem/application/$old" ]; then
                mv "feeds/qmodem/application/$old" "feeds/qmodem/application/$new"
                echo "QModem feed: renamed application/$old -> $new"
              fi
            done
          fi
          # 【重要】driver/ 下的包**不能改名**。
          # 它们是 KernelPackage（内核模块），与 application/ 下的普通包规则不同：
          #   - 普通包（define Package/x）: feeds 用【目录名】注册，
          #     故目录名必须 == PKG_NAME，否则依赖无法解析。
          #   - 内核包（define KernelPackage/x）: KernelPackage 宏会生成
          #     CONFIG_PACKAGE_kmod-x 符号，**包名由宏 + PKG_NAME 决定**，
          #     目录名本身不参与包名生成。
          # 实测教训：把 driver/fibocom_QMI_WWAN 改名为 qmi_wwan_f 后，
          #   feeds 按目录名注册为 'qmi_wwan_f'，安装阶段按 kmod-qmi_wwan_f
          #   查找时找不到，报：
          #     pkg_hash_check_unresolved: cannot find dependency kmod-qmi_wwan_f for qmodem
          #     opkg_install_cmd: Cannot install package luci-app-qmodem-next
          #   （.config 阶段无异常，因为 kconfig symbol 仍来自 KernelPackage 定义；
          #     只有打包安装阶段才暴露 → 故此前配置验证无法发现）
          # 结论：driver/ 保持原始目录名不动。

          # 修正上游 QModem 主包的幽灵依赖。
          # kconfig 在解析包可见性时会检查 DEPENDS 中所有条目，只要有一条
          # 指向不存在的包，整个包 symbol 就不可见 → 不出现在 .config。
          # 即使该依赖挂在未选中的 choice 选项下也一样（已知 kconfig 行为）。
          #
          # 两个不存在的包：
          #   kmod-mhi-wwan  → 本源码内核只有 kmod-mhi-wwan-ctrl /
          #                    kmod-mhi-wwan-mbim，没有无后缀的 kmod-mhi-wwan
          #   quectel-CM-5G  → QModem feed 只有 quectel-CM-5G-M，无 -5G 版本
          #                    （且仅 QWRT 固件才提供）
          # 二者的触发选项(GENERIC_MHI_PCIe_DRIVER / USING_QWRT_QUECTEL_CM_5G)
          # 均非本固件所选用，删除这些依赖条目不影响实际功能。
          #
          # 关键：必须用精确匹配（行尾的 " \" 锚定），否则会误伤：
          #   :quectel-CM-5G-M \   ← 有效依赖，实际被选中，绝不能删
          #   :kmod-mhi-wwan-ctrl \ ← 有效依赖，绝不能删
          # 实测确认 sed -E '/:[pattern]\s*\\$/d' 可正确区分。
          QMODEM_MK="feeds/qmodem/application/qmodem/Makefile"
          if [[ "${WRT_CONFIG^^}" == *"CPE"* ]] && [ -f "$QMODEM_MK" ]; then
            if grep -qE ':kmod-mhi-wwan[[:space:]]*\\$|:quectel-CM-5G[[:space:]]*\\$' "$QMODEM_MK"; then
              sed -i -E '/:kmod-mhi-wwan[[:space:]]*\\$/d; /:quectel-CM-5G[[:space:]]*\\$/d' "$QMODEM_MK"
              echo "QModem: removed ghost deps (kmod-mhi-wwan, quectel-CM-5G)"
            fi

            # 自检：删除后 quectel-CM-5G-M（有效依赖）必须仍然存在
            if grep -q 'quectel-CM-5G-M' "$QMODEM_MK"; then
              echo "QModem: quectel-CM-5G-M preserved (OK)"
            else
              echo "!!! QModem: quectel-CM-5G-M 被误删，依赖链将断裂 !!!"
            fi
          fi

          # usbutils 保险：Config 已启用 usbutils（B 方案）。
          # 若该链在本次构建仍不可用，qmodem 会因 DEPENDS 含 +usbutils
          # 继续被 kconfig 隐藏。此处做条件兜底：仅当 usbutils 未出现在
          # Config 中时才从 qmodem 主包依赖里摘掉它
          # （丢失 lsusb，不影响 QModem 主体）。
          if [[ "${WRT_CONFIG^^}" == *"CPE"* ]] && [ -f "$QMODEM_MK" ]; then
            if grep -q '^CONFIG_PACKAGE_usbutils=y' "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" 2>/dev/null; then
              echo "QModem: usbutils enabled in Config, keeping +usbutils (lsusb available)"
            elif grep -q '+usbutils ' "$QMODEM_MK"; then
              sed -i 's/+usbutils //' "$QMODEM_MK"
              echo "QModem: usbutils not enabled -> removed +usbutils (lsusb lost)"
            fi
          fi

          # 关键：feeds update 已在重命名之前生成了 feeds/qmodem.index，
          # 而 feeds install 读的是索引文件。必须重建索引，否则 install
          # 仍按旧目录名注册，依赖引用依旧落空。
          # update -i = Recreate the index only（不重新拉取仓库）
          if [[ "${WRT_CONFIG^^}" == *"CPE"* ]]; then
            ./scripts/feeds update -i
          fi

          # 【重要】不能用 `feeds install -a -p qmodem`。
          #
          # 该写法来自 V-OWRT-CI（跑 24.10 系 immortalwrt），但 25.12 的
          # scripts/feeds 改写了 -a/-p 的组合语义（见 feeds 第 726-736 行）：
          #   if($opts{a}) {
          #     foreach my $f (@feeds) {
          #       if (!defined($opts{p}) or $opts{p} eq $f->[1]) {   # ← 过滤！
          #         printf "Installing all packages from feed %s.\n", $f->[1];
          #         ... 只安装这个 feed 的包 ...
          #   }
          # 即 `-a -p qmodem` = 「**只**安装 qmodem feed 的包」，跳过其它所有 feed。
          #
          # 实测后果（CI run 38522316509，25.12 job）：
          #   24.10: Installing package 共 2033 次（packages 1709 / luci 227 / ...）
          #   25.12: Installing package 共  107 次（packages   60 / luci  13 / ...）
          #   → tailscale/sing-box/parted/yq/btrfs-progs/lua-cjson 等 packages feed
          #     的包从未安装、从未编译 → 索引缺失 → 最终 package/install 报
          #     ERROR: unable to select packages: tailscale (no such package) 等 8 项
          #
          # 而 qmodem 的包名（qmodem-*/quectel_*/tom_modem/ndisc6/...）经核对
          # 与 immortalwrt 官方 feed 无任何同名冲突，因此 -p 参数本就不必要。
          if [[ "${WRT_CONFIG^^}" == *"CPE"* ]]; then
            echo "Installing all feeds (qmodem included; no -p filter)"
          fi
          ./scripts/feeds install -a

      - name: Verify QModem Registration
        if: ${{ contains(inputs.WRT_CONFIG, 'CPE') }}
        run: |
          cd ./wrt/

          # 诊断输出：CI 失败时直接看这一步，不必翻上万行编译日志。
          echo "=========== QModem 包注册情况 ==========="
          echo "--- feeds/qmodem 目录结构 ---"
          find feeds/qmodem -maxdepth 2 -mindepth 1 -type d 2>/dev/null | sort

          echo "--- 已注册到 package/ 的 qmodem 相关包 ---"
          find package/feeds/qmodem -maxdepth 2 -name Makefile 2>/dev/null | sort || echo "(none)"

          echo "--- feeds/qmodem.index 中的 qmodem 条目 ---"
          grep -oE '^(Package|Provides): .*qmodem.*' feeds/qmodem.index 2>/dev/null | head -40 || echo "(index missing)"

          echo "--- luci-app-qmodem-next 的 LUCI_DEPENDS ---"
          grep -n 'LUCI_DEPENDS' feeds/qmodem/luci/luci-app-qmodem-next/Makefile 2>/dev/null || echo "(not found)"

          echo "--- 旧版 luci-app-qmodem 的 LUCI_DEPENDS（互斥守卫） ---"
          grep -n -A2 'LUCI_DEPENDS' feeds/qmodem/luci/luci-app-qmodem/Makefile 2>/dev/null || echo "(not found)"

          echo "--- 主包 DEPENDS 中残留的幽灵依赖检查 ---"
          # 注意：必须行尾反斜杠锚定，否则 ':kmod-mhi-wwan' 会子串命中
          # 有效依赖 ':kmod-mhi-wwan-ctrl' / ':kmod-mhi-wwan-mbim'（误报）
          if grep -qE ':kmod-mhi-wwan[[:space:]]*\\$|:quectel-CM-5G[[:space:]]*\\$' feeds/qmodem/application/qmodem/Makefile 2>/dev/null; then
            echo "!!! 幽灵依赖仍存在，清理失败 !!!"
            grep -nE ':kmod-mhi-wwan[[:space:]]*\\$|:quectel-CM-5G[[:space:]]*\\$' feeds/qmodem/application/qmodem/Makefile
          else
            echo "OK: 幽灵依赖已清理"
          fi

          echo "--- 目录名是否已对齐 PKG_NAME ---"
          for d in qmodem-settings quectel-CM-5G-M; do
            if [ -d "feeds/qmodem/application/$d" ]; then
              echo "OK: application/$d 存在"
            else
              echo "!!! application/$d 缺失（改名未生效）"
            fi
          done

          echo "========================================="

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc) && make clean -j$(nproc)

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        # 步骤级硬超时（GitHub 原生）。这一层无论如何都要有：即使脚本内部的
        # timeout 失效、或有子进程持有 stdout 让步骤永不结束，也一定会被 runner
        # 强制终止，不会一路挂到 job 的 360 分钟上限（对齐 V-OWRT-CI 3e8a92f）。
        timeout-minutes: 150
        run: |
          echo "=== 下载前磁盘 ==="; df -h /
          cd ./wrt/

          # 这一步会编译 host tools + 交叉工具链，4 核 runner 上约 90-120 分钟，
          # 属固有成本；内部 timeout 只用于真正卡死时兜底。
          timeout -k 30 9000 make download -j$(nproc) || {
            rc=$?
            echo "::warning title=make download 未正常结束::退出码 $rc（124=超时，137/143=被强杀）"
            df -h /
          }

          # ── 收尾：等子进程自己结束 ──
          # 绝不要在这里用 `pkill -f <含 curl|wget 的正则>`：脚本全文都在执行它的
          # bash 的 /proc/PID/cmdline 里，而正则参数本身又含 curl/wget 字样，
          # pkill -f 会匹配到自己并自杀，整个步骤以 exit -15 结束（V-OWRT-CI bcfacdb）。
          wait 2>/dev/null || true
          sleep 2

          echo "=== 下载后磁盘 ==="; df -h /
          echo "dl 目录文件数: $(ls dl 2>/dev/null | wc -l)"

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make -j$(nproc) || make -j1 V=s

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            全系带闭源硬件加速，别问了！

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}
